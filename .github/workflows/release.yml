name: Release

# Triggered on push to main when the commit message contains a semver
# bump keyword (#patch, #minor, #major). Computes the next version from
# the repo's own tags (independent of the API version), bumps
# Version.php, verifies, tags, cuts a GitHub Release, and dispatches
# to TapTap-Pay/woocommerce so it can pin the new SDK version.
#
# Packagist polls GitHub tags directly — no explicit publish step needed
# beyond creating the tag and release.

on:
  push:
    branches: [main]

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.head_commit.message, '#patch') ||
      contains(github.event.head_commit.message, '#minor') ||
      contains(github.event.head_commit.message, '#major')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: bump
        run: |
          MSG='${{ github.event.head_commit.message }}'
          if [[ "$MSG" == *"#major"* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == *"#minor"* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          LATEST=$(git tag --list --sort=-v:refname '[0-9]*.[0-9]*.[0-9]*' | head -1)
          LATEST=${LATEST:-0.0.0}
          IFS='.' read -r major minor patch <<< "$LATEST"
          case "${{ steps.bump.outputs.type }}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          echo "tag=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${major}.${minor}.${patch}"

      - name: Bump Version.php
        run: php bump.php "${{ steps.version.outputs.tag }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json, mbstring
          coverage: none

      - name: Verify
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          find src tests examples gen -type f -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          if [ -d tests ] && find tests -type f -name '*Test.php' | grep -q .; then
            vendor/bin/phpunit
          fi

      - name: Commit, tag, push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          fi
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  notify_woocommerce:
    name: Dispatch to WooCommerce
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SDK_RELEASER_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASER_PRIVATE_KEY }}
          owner: TapTap-Pay
          repositories: woocommerce

      - name: Dispatch sdk-php-released event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/TapTap-Pay/woocommerce/dispatches \
            -f event_type=sdk-php-released \
            -f "client_payload[version]=${{ needs.release.outputs.version }}"
